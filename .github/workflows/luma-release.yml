# Publishes a Luma release. Claude pushes a branch "luma-incoming" holding
# incoming/LumaPlayer.apk + incoming/luma.json; this creates the release
# luma-vX.Y with the APK, puts luma.json on main (what the app checks) and
# removes the branch so the APK never stays in main's history.
name: Luma release
on:
  push:
    branches: [luma-incoming]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(jq -r .versionName incoming/luma.json)
          TAG="luma-v$VER"
          NOTES=$(jq -r '.notes | map("• " + .) | join("\n")' incoming/luma.json)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" incoming/LumaPlayer.apk --clobber
          else
            gh release create "$TAG" incoming/LumaPlayer.apk --title "Luma $VER" --notes "$NOTES" --target main
          fi
          cp incoming/luma.json /tmp/luma.json
      - name: Update luma.json on main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/luma.json luma.json
          git config user.name "github-actions[bot]"
          git config user.email "41898315+github-actions[bot]@users.noreply.github.com"
          git add luma.json
          git commit -m "Luma $(jq -r .versionName luma.json) (build $(jq -r .versionCode luma.json))" || true
          git push origin main
          git push origin --delete luma-incoming
